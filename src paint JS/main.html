<!DOCTYPE html>
<html lang = "en">

<head>
  <meta charset = "UTF-8" />
  <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />
  <title>Cat Whisper Studio</title>
  <link rel = "stylesheet" href="front.css" />

  <link rel = "preconnect" href="https://fonts.googleapis.com" />
  <link href = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700&displa = swap" rel = "stylesheet" />
</head>
<body>

  <header class = "menubar">
    <div class = "menubar-logo">
      <span class = "logo-icon">◈</span>
      <span class = "logo-text">PointerCat</span>
    </div>
    <nav class = "menubar-nav">
      <button class = "menu-btn" id = "btn-new">New</button>
      <button class = "menu-btn" id = "btn-clear">Clear</button>
      <button class = "menu-btn highlight" id = "btn-save">Export PNG</button>
    </nav>
    <div class = "menubar-info">
      <span id = "canvas-info">1200 × 800</span>
    </div>
  </header>

  <div class = "options-bar" id = "options-bar">
    <div class = "option-group" id = "opt-brush-size">
      <label>Size</label>
      <input type = "range" id = "brush-size" min = "1" max = "200" value = "20" />
      <span class = "val" id = "brush-size-val">20</span>
    </div>

    <div class = "option-group" id = "opt-opacity">
      <label>Opacity</label>
      <input type = "range" id = "brush-opacity" min = "1" max = "100" value = "100" />
      <span class = "val" id = "brush-opacity-val">100%</span>
    </div>

    <div class = "option-group" id = "opt-hardness">
      <label>Hardness</label>
      <input type = "range" id = "brush-hardness" min = "0" max = "100" value = "80" />
      <span class = "val" id = "brush-hardness-val">80%</span>
    </div>

    <div class = "option-group" id = "opt-brush-type">
      <label>Brush</label>
      <select id = "brush-type-select">
        <option value = "round">Round</option>
        <option value = "soft">Soft</option>
        <option value = "spray">Spray</option>
        <option value = "pixel">Pixel</option>
        <option value = "calligraphy">Calligraphy</option>
      </select>
    </div>

    <div class = "option-group" id = "opt-spacing" style = "display:none">
      <label>Spacing</label>
      <input type = "range" id = "brush-spacing" min="1" max = "50" value = "5" />
      <span class = "val" id = "brush-spacing-val">5</span>
    </div>
  </div>

  <div class = "workspace">
    <aside class = "toolbar" id = "toolbar">
      <div class = "tool-section">
        <button class = "tool-btn active" id = "tool-brush" data-tool = "brush" title = "Brush (B)">
          <svg viewBox="0 0 24 24">

            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
          </svg>

          <span>Brush</span>
        </button>

        <button class="tool-btn" id="tool-eraser" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24">
            <path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20h7.66l8.72-8.72c.79-.78.79-2.05 0-2.83l-4.85-4.86c-.39-.39-.9-.59-1.42-.59zm-7.3 15l-2.18-2.18 7.86-7.86 2.18 2.18L7.84 18z"/>
          </svg>

          <span>Eraser</span>
        </button>

        <button class="tool-btn" id="tool-eyedropper" data-tool="eyedropper" title="Eyedropper (I)">
          <svg viewBox="0 0 24 24">
            <path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3a2 2 0 001.42-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12c.4-.4.4-1.03.16-1.65zM7 17v-1.46l6.65-6.65 1.45 1.45L8.46 17H7z"/>
          </svg>

          <span>Pick</span>
        </button>

        <button class="tool-btn" id="tool-fill" data-tool="fill" title="Fill (G)">
          <svg viewBox="0 0 24 24">
            <path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.56-.59 1.53 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.59.59-1.56 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/><path d="M0 20h24v4H0z" 
            opacity=".36"/>
          </svg>

          <span>Fill</span>
        </button>
      </div>

      <div class="tool-divider"></div>

      <div class = "color-swatches">
        <div class = "swatch-stack">
          <div id = "bg-color-swatch" class = "swatch bg-swatch" 
          title = "Background Color"></div>

          <div id = "fg-color-swatch" class = "swatch fg-swatch" 
          title = "Foreground Color (click to open picker)"></div>

        </div>
        <button class="swap-btn" id="swap-colors" title="Swap colors">⇄</button>
        <button class="reset-btn" id="reset-colors" title="Reset to black/white">↺</button>
      </div>
    </aside>

    <main class = "canvas-area">
      <div class = "canvas-scroll-wrap" id = "canvas-scroll-wrap">
        <div class = "canvas-container" id = "canvas-container">
          <canvas id = "main-canvas"></canvas>
          <canvas id = "overlay-canvas"></canvas>
        </div>
      </div>

      <div class = "zoom-controls">
        <button id = "zoom-out">−</button>
        <span id = "zoom-level">100%</span>
        <button id = "zoom-in">+</button>
        <button id = "zoom-fit">Fit</button>
      </div>
    </main>

    <aside class = "right-panel">
      <div class = "panel-header">Color</div>

      <div class = "color-picker-wrap">
        <div class = "hsv-picker">
          <div class = "sv-box-wrap">
            <canvas id = "sv-canvas" width = "200" height = "200"></canvas>
            <div id = "sv-cursor"></div>
          </div>
          <div class = "hue-bar-wrap">
            <canvas id = "hue-canvas" width = "20" height = "200"></canvas>
            <div id = "hue-cursor"></div>
          </div>
        </div>

        <div class = "color-inputs">
          <div class = "input-row">
            <label>#</label>
            <input type = "text" id = "hex-input" maxlength = "6" value = "000000" spellcheck = "false" />
          </div>
          <div class = "input-row triple">
            <div>
              <label>R</label>
              <input type = "number" id = "r-input" min = "0" max = "255" value = "0" />
            </div>
            <div>
              <label>G</label>
              <input type = "number" id = "g-input" min = "0" max = "255" value = "0" />
            </div>
            <div>
              <label>B</label>
              <input type = "number" id = "b-input" min = "0" max = "255" value = "0" />
            </div>
          </div>
        </div>

        <div class = "color-preview-row">
          <div class = "preview-box" id = "new-color-preview"></div>
          <div class = "preview-box" id = "old-color-preview"></div>
        </div>
      </div>

      <div class = "panel-divider"></div>

      <div class = "panel-header">Preview</div>
      <div class = "brush-preview-wrap">
        <canvas id = "brush-preview-canvas" width = "200" height = "80"></canvas>
      </div>

      <div class = "panel-divider"></div>

      <div class = "panel-header">Swatches</div>
      <div class = "swatches-grid" id = "swatches-grid"></div>
    </aside>

  </div>

  <div id="custom-cursor"></div>

  <div id = "eyedropper-preview" class = "eyedropper-preview" style = "display:none">
    <div id = "eyedropper-color"></div>
    <span id = "eyedropper-hex"></span>
  </div>

  <script src = "call.js"></script>
  <script src = "brushes.js"></script>
  <script src = "eraser.js"></script>
  <script src = "cpicker.js"></script>
  <script src = "canvas.js"></script>
  <script src = "file_save.js"></script>
</body>
</html>

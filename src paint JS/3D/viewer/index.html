<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Viewer * Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="ref.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span class="brand-dot"></span></span>
      <div class="brand-text">
        <span class="brand-name">Cat | Whisper </span>
        <span class="brand-eyebrow">3D Model Viewer</span>
      </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Viewer controls">
      <button class="tool-btn" id="btn-upload" type="button">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 12.5V3M10 3L6.5 6.5M10 3l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 13v2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Upload</span>
      </button>

      <div class="tool-divider"></div>

      <button class="icon-btn" id="btn-reset" type="button" disabled data-tooltip="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 20 20" fill="none"><path d="M16 10a6 6 0 1 1-2.1-4.55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 3.5v3.4h-3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-wireframe" type="button" disabled data-tooltip="Wireframe" aria-label="Toggle wireframe">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5 17 6.5v7L10 17.5 3 13.5v-7L10 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 2.5v15M3 6.5l7 4 7-4M3 13.5l7-4 7 4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn is-active" id="btn-grid" type="button" disabled data-tooltip="Grid" aria-label="Toggle grid">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M3 8.5h14M3 13h14M8.5 3v14M13 3v14" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="icon-btn" id="btn-autorotate" type="button" disabled data-tooltip="Auto-rotate" aria-label="Toggle auto-rotate">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 4.5a6 6 0 0 1 5.6 4M10 15.5a6 6 0 0 1-5.6-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.6 4.8v3.7h-3.7M4.4 15.2v-3.7h3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" disabled data-tooltip="Backdrop" aria-label="Toggle backdrop contrast">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13V3.5Z" fill="currentColor"/></svg>
      </button>

      <div class="tool-divider"></div>

      <button class="icon-btn" id="btn-info" type="button" disabled aria-pressed="false" data-tooltip="Model info" aria-label="Toggle model info">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="6.6" r="0.9" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="viewport"></canvas>

    <div class="empty-state" id="empty-state">
      <div class="orbit-ring" aria-hidden="true">
        <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 7"/><circle class="orbit-dot" cx="100" cy="16" r="4" fill="currentColor"/></svg>
      </div>
      <svg class="empty-icon" viewBox="0 0 40 40" fill="none"><path d="M20 26V10m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 26v3a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Drop a model to inspect it</h1>
      <p>Supports GLB, GLTF, OBJ, and FBX files.</p>
      <button class="btn-primary" id="btn-browse" type="button">Browse files</button>
    </div>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
      <div class="drop-card">Release to load model</div>
    </div>

    <div class="loading-state" id="loading-state" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="loading-label">Reading file . . .</span>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>

    <p class="hint-bar" id="hint-bar" hidden>Drag to orbit&nbsp; · &nbsp;Scroll to zoom&nbsp; · &nbsp;Right-drag to pan</p>
  </main>

  <aside class="info-panel" id="info-panel" hidden>
    <div class="info-header">
      <h2 id="info-filename">—</h2>
      <span class="format-badge" id="info-format">—</span>
    </div>
    <dl class="info-stats">
      <div><dt>File size</dt><dd id="stat-size">—</dd></div>
      <div><dt>Dimensions</dt><dd id="stat-dims">—</dd></div>
      <div><dt>Vertices</dt><dd id="stat-verts">—</dd></div>
      <div><dt>Triangles</dt><dd id="stat-tris">—</dd></div>
      <div><dt>Meshes</dt><dd id="stat-meshes">—</dd></div>
      <div><dt>Materials</dt><dd id="stat-mats">—</dd></div>
    </dl>
    <button class="btn-secondary" id="btn-replace" type="button">Load another model</button>
  </aside>

  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.fbx" hidden />
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="loader.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset = "UTF-8" />
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0"/>
  <title>SNAKE</title>
  <link rel="preconnect" href = "https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />

  <link rel = "stylesheet" href = "abb.css" />
</head>
<body>

  <div class = "scanlines">
      
  </div>

  <div class = "app">

    <header class = "header">
      <div class = "header-left">
        <span class = "logo">SN<span class="logo-accent">AK</span>E</span>
        <span class = "version">v2.0</span>
      </div>

      <div class = "header-right">
        <div class = "stat-box">
          <span class = "stat-label">SCORE</span>
          <span class = "stat-value" id="score">000</span>
        </div>
        <div class = "stat-box">
          <span class = "stat-label">BEST</span>
          <span class = "stat-value" id="best">000</span>
        </div>

        <div class = "stat-box">
          <span class = "stat-label">LENGTH</span>
          <span class = "stat-value" id="length">001</span>
        </div>
      </div>
    </header>

    <div class = "main">

      <aside class = "side-panel left-panel">
        <div class = "panel-section">
          <div class = "panel-label">COLOR : SNAKE</div>
          <div class = "color-row">
            <input type = "color" id = "snakeColor" value = "#00ff88" class = "color-picker" />
            <span class = "color-hex" id = "snakeHex">#00FF88</span>
          </div>
        </div>

        <div class = "panel-section">
          <div class = "panel-label">COLOR : FOOD</div>
          <div class = "color-row">
            <input type = "color" id = "foodColor" value = "#ff3366" class = "color-picker" />
            <span class = "color-hex" id = "foodHex">#FF3366</span>
          </div>
        </div>

        <div class = "panel-section">
          <div class = "panel-label">SPEED</div>
          <div class = "speed-btns">
            <button class = "speed-btn active" data-speed = "120">SLOW</button>
            <button class = "speed-btn" data-speed = "80">MED</button>
            <button class = "speed-btn" data-speed = "50">FAST</button>
          </div>
        </div>

        <div class = "panel-section controls-info">

          <div class = "key-grid">
          </div>
        </div>
      </aside>

      <div class = "canvas-wrap">
        <canvas id = "gameCanvas"></canvas>

        <div class = "overlay" id = "startOverlay">
          <div class = "overlay-content">
            <div class = "overlay-title">The Snake</div>
            <div class = "overlay-sub">Made by Cat Whisper 010001</div>
            <div class = "overlay-divider"></div>
            <div class = "overlay-hint">* * * * * * * * * * * * *</div>
            <button class = "start-btn" id="startBtn">PRESS START</button>
            <div class = "overlay-keys">or press <kbd>SPACE</kbd> / <kbd>ENTER</kbd></div>
          </div>
        </div>

        <div class = "overlay hidden" id = "gameoverOverlay">
          <div class = "overlay-content">
            <div class = "overlay-title gameover-title">DEAD</div>
            <div class = "gameover-score-row">
              <span class = "gameover-label">SCORE</span>
              <span class = "gameover-val" id="finalScore">0</span>
            </div>
            <div class="gameover-score-row">
              <span class = "gameover-label">BEST</span>
              <span class = "gameover-val" id = "finalBest">0</span>
            </div>
            <button class = "start-btn" id = "restartBtn">PLAY AGAIN</button>
          </div>
        </div>
      </div>

      <aside class = "side-panel right-panel">
        <div class = "panel-section">
          <div class = "panel-label">STATUS</div>
          <div class ="status-indicator" id="statusIndicator">
            <span class = "status-dot" id="statusDot"></span>
            <span id = "statusText">READY</span>
          </div>
        </div>

        <div class = "panel-section">
          <div class = "panel-label">LEVEL</div>
          <div class = "level-display" id = "levelDisplay">01</div>
        </div>
        <div class = "panel-section">
          <div class = "panel-label">NEXT LVL</div>
          <div class = "xp-bar-wrap">
            <div class =" xp-bar" id = "xpBar" style = "width:0%"></div>
          </div>
          <div class = "xp-label" id = "xpLabel">0 / 5</div>
        </div>
        <div class = "panel-section">
          <div class = "log" id="log"></div>
        </div>
      </aside>

    </div>

    <footer class = "footer">
      <span>BOUNDARY COLLISION ACTIVE</span>
      <span class = "footer-sep">·</span>
      <span>NO WRAP</span>
      <span class = "footer-sep">·</span>
      <span id = "fpsDisplay">-- FPS</span>
    </footer>

  </div>

  <script src = "ssnake.js"></script>
</body>
</html>
